<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangLab</title>
<meta name="description" content="Ứng dụng học ngoại ngữ theo bài. Bắt đầu với tiếng Hàn: từ vựng, ngữ pháp, hội thoại, tra từ điển và hướng dẫn thứ tự nét viết chữ Hangul.">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=260907c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lexend:wght@300;400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/langlab.css?v=260907c">
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand" data-go="home" role="link" tabindex="0" title="Về trang chủ LangLab">
      <span class="brand-mark">
        <svg viewBox="0 0 96 96" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M51 34 C49 41 48 47 48 51" stroke="#C2CBD4" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 6"/><g transform="rotate(40 62 18)"><path d="M56 9 L56 30 q0 6 6 6 t6 -6 L68 9" stroke="#17222E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M53.5 9 L70.5 9" stroke="#17222E" stroke-width="3.4" stroke-linecap="round"/></g><path d="M35.5 66 Q41 63 47 66 Q53 69 60.5 66 L60.5 75 Q60.5 80 55 80 L41 80 Q35.5 80 35.5 75 Z" fill="#DCE8F6"/><path d="M35 52 L35 75 Q35 81 41 81 L55 81 Q61 81 61 75 L61 52" stroke="#17222E" stroke-width="2.6" stroke-linejoin="round"/><path d="M31 50 Q34 52 36 52 L62 52" stroke="#17222E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 60 h5 M38 66 h4" stroke="#AEB9C4" stroke-width="1.6" stroke-linecap="round"/><g font-family="'Noto Sans KR','Yu Gothic','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="700" text-anchor="middle"><text x="55" y="30" font-size="13" fill="#1B4D8F">A</text><text x="51" y="40" font-size="13" fill="#C8402F">ㅏ</text><text x="48" y="50" font-size="12" fill="#A67C1E">あ</text><text x="47" y="60" font-size="12" fill="#2F6FBF">阿</text><text x="48" y="74" font-size="12" fill="#1F7A5A">а</text></g></svg>
      </span>
      <span>
        <span class="brand-name">LangLab</span>
        <span class="brand-sub">언어 실험실</span>
      </span>
    </div>

    <div class="lang-switch" id="langSwitch"></div>

    <div class="nav-label"><span class="eyebrow">Học tập</span></div>

    <button class="nav-btn" data-go="home" aria-current="page">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg></span>
      Khoá học <span class="nav-count">15</span>
    </button>
    <button class="nav-btn" data-go="write">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M12 19l7-7-4-4-7 7v4h4z"/><path d="M5 19h3"/></svg></span>
      Tập viết <span class="nav-count">40</span>
    </button>
    <button class="nav-btn" data-go="shadow">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 8v8M8 5v14M12 9v6M16 6v12M20 10v4"/></svg></span>
      Shadowing
    </button>
    <button class="nav-btn" data-go="srs">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h14v12"/></svg></span>
      Ôn tập <span class="nav-count">28</span>
    </button>
    <button class="nav-btn" data-go="dict">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      Từ điển
    </button>
    <button class="nav-btn" data-go="quiz">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg></span>
      Bài tập
    </button>
    <button class="nav-btn" data-go="numbers">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg></span>
      Số đếm
    </button>
    <button class="nav-btn" data-go="topik">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M9 5h6M9 9h6M9 13h4"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg></span>
      Thi thử TOPIK
    </button>
    <button class="nav-btn" id="labiNav" data-labi-toggle="1" aria-current="false">
      <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      Labi <span class="nav-count">AI</span>
    </button>

    <div class="side-foot">
      <span class="streak">Chuỗi ngày học <b>17</b></span>
      <button class="theme-btn" id="themeBtn">Giao diện: theo hệ thống</button>
      <button class="foot-link" data-go="about">Giới thiệu LangLab</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <nav class="crumb" id="crumb">Tiếng Hàn <span>›</span> <b>Khoá học</b></nav>
      <div class="top-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="topq" type="search" placeholder="Tra nhanh một từ…" autocomplete="off">
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<script src="js/strokes.js?v=260907c"></script>
<script src="js/course-ko.js?v=260907c"></script>
<script src="js/vocab-common.js?v=260907c"></script>
<script src="js/tts.js?v=260907c"></script>
<script src="js/config.js?v=260907c"></script>
<script src="js/translate.js?v=260907c"></script>
<script src="js/speech.js?v=260907c"></script>
<script src="js/words.js?v=260907c"></script>
<script>
/* danh sách ngôn ngữ ở thanh bên — dựng trước khi app.js chạy */
document.getElementById('langSwitch').innerHTML = LANGUAGES.map(l => `
  <button class="lang-btn" ${l.status === 'active' ? 'aria-current="true"' : 'disabled'} title="${l.note}">
    <span class="lang-mark">${l.mark}</span>
    <span>${l.label}</span>
    ${l.status === 'active' ? '' : '<span class="lang-soon">sắp có</span>'}
  </button>`).join('');
</script>
<script src="js/app.js?v=260907c"></script>
</body>
</html>

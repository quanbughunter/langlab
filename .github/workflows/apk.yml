# Dựng tệp APK cho Android ngay trên máy chủ GitHub.
#
# Không phải cài Android Studio, không phải cài SDK, không phải cài gì cả:
# máy chủ của GitHub đã có sẵn Android SDK. Việc của mình chỉ là bấm nút.
#
# CÁCH DÙNG
#   1. Lên github.com/quanbughunter/langlab → thẻ Actions
#   2. Chọn «Dựng APK cho Android» ở cột trái
#   3. Bấm «Run workflow», chọn thứ tiếng muốn đóng audio, bấm nút xanh
#   4. Chờ chừng 10–20 phút, rồi tải tệp APK ở mục Artifacts của lần chạy đó
#
# Tệp tải về là .zip, giải nén ra mới là .apk — GitHub luôn nén artifact lại.
name: Dựng APK cho Android

on:
  workflow_dispatch:
    inputs:
      tieng:
        description: 'Đóng audio của thứ tiếng nào (cách nhau bằng dấu cách): ko zh ja ru en fr es'
        required: false
        default: 'ko'
        type: string
      khong_audio:
        description: 'Không đóng audio — APK chỉ ~10 MB, dùng giọng đọc của điện thoại'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dung-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        # Kho này có cả nghìn tệp mp3 nên chỉ lấy ảnh chụp mới nhất,
        # không lấy toàn bộ lịch sử.
        with:
          fetch-depth: 1

      # Capacitor 8.5 biên dịch ở mức Java 21 — xem
      # capacitor-cordova-android-plugins/build.gradle trong dự án nó sinh ra.
      # JDK thấp hơn sẽ báo «invalid source release: 21».
      - name: Chuẩn bị JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Chuẩn bị Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Chuẩn bị Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dựng bản HTML một tệp
        run: python build.py

      # Ô nhập đi qua BIẾN MÔI TRƯỜNG chứ không nhúng thẳng vào dòng lệnh:
      # ${{ }} được thay chuỗi TRƯỚC khi shell chạy, nên gõ vào đó một dấu ;
      # là chạy được lệnh tuỳ ý. Chỉ người có quyền trong kho mới bấm được nút
      # này, nhưng viết đúng thì chẳng tốn gì.
      - name: Gom nội dung vào android-app/www
        env:
          TIENG: ${{ inputs.tieng }}
          KHONG_AUDIO: ${{ inputs.khong_audio }}
        run: |
          if [ "$KHONG_AUDIO" = "true" ]; then
            python tools/gom-app.py --khong-audio
          else
            python tools/gom-app.py --tieng $TIENG
          fi

      # Nếu kho chưa có audio/tts/<giọng>/ thì gom-app.py đã in cảnh báo ở trên
      # và bỏ qua — APK vẫn dựng được, chỉ là không có giọng thu sẵn.
      - name: Xem gói nặng bao nhiêu
        run: du -sh android-app/www && find android-app/www -name '*.mp3' | wc -l

      - name: Cài thư viện Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      # Phải dựng icon TRƯỚC khi gọi cap add: công cụ cần ba ảnh nguồn trong
      # android-app/assets/.
      - name: Dựng ảnh nguồn cho biểu tượng
        run: |
          python -m pip install --quiet Pillow
          python tools/tao-icon.py

      - name: Tạo dự án Android
        working-directory: android-app
        run: npx cap add android

      # «cap add android» dựng dự án kèm biểu tượng MẶC ĐỊNH của Capacitor.
      # Không chạy bước này thì cài vào máy sẽ thấy logo Capacitor chứ không
      # phải logo LangLab — đúng lỗi đã gặp ở bản dựng đầu tiên.
      - name: Thay biểu tượng mặc định bằng logo LangLab
        working-directory: android-app
        run: npx capacitor-assets generate --android

      - name: Soi lại biểu tượng đã thay chưa
        working-directory: android-app
        run: |
          echo "Các tệp biểu tượng đã sinh:"
          find android/app/src/main/res -name 'ic_launcher*' | sort | head -20

      # Cử chỉ vuốt cạnh: plugin @capacitor/app đưa cú back vào bộ định tuyến
      # (xem js/back-native.js). Cờ trong manifest chỉ thêm hình xem trước lúc
      # vuốt, và chỉ cần cho máy Android 13–14; từ 15 trở lên bật sẵn.
      - name: Bật hình xem trước khi vuốt cạnh
        run: python tools/sua-manifest.py

      - name: Soi lại plugin quay lại đã vào gói chưa
        working-directory: android-app
        run: |
          grep -q "capacitor-app" android/capacitor.settings.gradle \
            || { echo "THIẾU @capacitor/app — cú back sẽ thoát app"; exit 1; }
          grep -q "enableOnBackInvokedCallback" android/app/src/main/AndroidManifest.xml \
            || { echo "Manifest chưa có cờ vuốt cạnh"; exit 1; }
          grep -q "__backNative" www/index.html \
            || { echo "Bản HTML chưa nhúng js/back-native.js"; exit 1; }
          echo "OK: plugin, cờ manifest và lớp đệm đều có mặt."

      - name: Biên dịch APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đặt tên tệp theo ngày
        id: ten
        run: echo "ngay=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Nộp tệp APK
        uses: actions/upload-artifact@v4
        with:
          name: langlab-${{ steps.ten.outputs.ngay }}-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

<title>LangLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Lexend:wght@300;400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   LangLab — hệ thống giao diện
   Bảng màu lấy cảm hứng từ mực nho trên giấy ô vuông 원고지:
   nền giấy lạnh, chữ mực xanh đậm, dấu son đỏ cho nét đang viết.
   ============================================================ */

:root{
  --ground:#EDF0F3;
  --surface:#FFFFFF;
  --surface-2:#E4E9EE;
  --ink:#10161C;
  --muted:#54626F;
  --faint:#8593A0;
  --line:#D6DDE4;
  --line-strong:#B9C4CF;
  --accent:#1B4D8F;
  --accent-2:#2F6FBF;
  --accent-soft:#DCE8F6;
  --seal:#C8402F;
  --seal-soft:#F8E4E0;
  --gold:#A67C1E;
  --gold-soft:#F3EAD2;
  --ok:#1F7A5A;
  --ok-soft:#DCEFE7;
  --shadow-sm:0 1px 2px rgba(16,22,28,.06);
  --shadow:0 1px 3px rgba(16,22,28,.07), 0 10px 30px -16px rgba(16,22,28,.28);
  --r:10px;
  --r-lg:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1216; --surface:#141B21; --surface-2:#1D252C;
    --ink:#E4EBF1; --muted:#94A3B0; --faint:#6E7C89;
    --line:#232D35; --line-strong:#35424D;
    --accent:#71ABEA; --accent-2:#8FC0F5; --accent-soft:#14293F;
    --seal:#F0796A; --seal-soft:#33201D;
    --gold:#D9B45E; --gold-soft:#2C2617;
    --ok:#5FC79D; --ok-soft:#122C24;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 12px 34px -18px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1216; --surface:#141B21; --surface-2:#1D252C;
  --ink:#E4EBF1; --muted:#94A3B0; --faint:#6E7C89;
  --line:#232D35; --line-strong:#35424D;
  --accent:#71ABEA; --accent-2:#8FC0F5; --accent-soft:#14293F;
  --seal:#F0796A; --seal-soft:#33201D;
  --gold:#D9B45E; --gold-soft:#2C2617;
  --ok:#5FC79D; --ok-soft:#122C24;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.5), 0 12px 34px -18px rgba(0,0,0,.85);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6; font-weight:300;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{margin:0;line-height:1.16;text-wrap:balance;font-weight:600}
h1,h2{font-family:"Fraunces","Lexend",Georgia,serif;font-weight:600;font-variation-settings:"SOFT" 20,"WONK" 1}
p{margin:0}
button{font-family:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ko{font-family:"Noto Sans KR","Lexend",sans-serif;font-weight:500}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.eyebrow{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500;
}
.hide{display:none !important}

/* ================= khung ứng dụng ================= */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}

.side{
  border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 16px}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--accent);color:var(--surface);
  font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:16px;
}
.brand-name{font-family:"Fraunces","Lexend",serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--faint);letter-spacing:.06em;margin-top:-2px}

.lang-switch{margin:0 4px 14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.lang-btn{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:none;
  cursor:pointer;color:var(--muted);font-size:13px;text-align:left;border-bottom:1px solid var(--line);
}
.lang-btn:last-child{border-bottom:none}
.lang-btn:hover:not(:disabled){background:var(--surface);color:var(--ink)}
.lang-btn[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:500}
.lang-btn:disabled{opacity:.45;cursor:not-allowed}
.lang-mark{
  width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;
  background:var(--line);color:var(--muted);font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:700;
}
.lang-btn[aria-current="true"] .lang-mark{background:var(--accent);color:var(--surface)}
.lang-soon{margin-left:auto;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

.nav-label{padding:12px 12px 6px}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 11px;border-radius:9px;border:1px solid transparent;background:none;
  font-size:13.5px;color:var(--muted);cursor:pointer;
}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{
  background:var(--accent-soft);color:var(--accent);font-weight:500;
  border-color:color-mix(in srgb,var(--accent) 22%,transparent);
}
.nav-ico{width:20px;height:20px;flex:none;display:grid;place-items:center}
.nav-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-count{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--faint)}

.side-foot{margin-top:auto;padding:14px 11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.streak{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--muted)}
.streak b{font-family:"JetBrains Mono",monospace;font-size:17px;color:var(--seal);font-weight:600}
.theme-btn{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;
  font-size:12px;color:var(--muted);cursor:pointer;text-align:left;
}
.theme-btn:hover{border-color:var(--line-strong);color:var(--ink)}

/* ================= vùng nội dung ================= */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 26px;background:color-mix(in srgb,var(--ground) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.crumb{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px;min-width:0}
.crumb b{color:var(--ink);font-weight:500}
.crumb span{color:var(--line-strong)}
.top-search{margin-left:auto;position:relative;display:flex;align-items:center}
.top-search input{
  width:230px;padding:7px 12px 7px 32px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:300;
}
.top-search input::placeholder{color:var(--faint)}
.top-search svg{position:absolute;left:11px;width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.8}
.view{padding:30px 26px 70px;max-width:1180px;width:100%}
.view.wide{max-width:none}

.page-head{margin-bottom:26px}
.page-head h1{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.015em}
.page-head p{color:var(--muted);margin-top:9px;max-width:70ch;font-size:14.5px}

/* ================= trang khoá học ================= */
.level-strip{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;margin-bottom:26px}
.level-chip{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;
  font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.level-chip .lv-ko{font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--faint)}
.level-chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}
.level-chip[aria-pressed="true"] .lv-ko{color:var(--ground);opacity:.7}
.level-chip:not([disabled]):hover{border-color:var(--accent);color:var(--ink)}
.level-chip:disabled{opacity:.5;cursor:not-allowed}
.lv-soon{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:99px;padding:1px 6px}

.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.lesson-card{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;position:relative;
  transition:border-color .15s, transform .15s;
}
.lesson-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.lesson-no{
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--faint);
  display:flex;align-items:center;gap:8px;
}
.lesson-no i{width:22px;height:2px;background:var(--line-strong);display:block;font-style:normal}
.lesson-card h3{font-family:"Noto Sans KR",sans-serif;font-size:21px;font-weight:700;letter-spacing:-.01em}
.lesson-card .vi{font-size:14px;color:var(--ink);font-weight:400;margin-top:-4px}
.lesson-card .skill{font-size:12.5px;color:var(--muted);line-height:1.5}
.gram-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.gtag{
  font-family:"Noto Sans KR",sans-serif;font-size:11px;padding:2px 7px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);
}
.lesson-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.lesson-foot .n{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}
.prog{flex:1;height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* ================= trang bài học ================= */
.lesson-hero{
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:24px 26px;margin-bottom:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;
}
.lesson-hero h1{font-family:"Noto Sans KR",sans-serif;font-size:34px;font-weight:700;letter-spacing:-.02em}
.lesson-hero .sub{font-size:17px;color:var(--muted);margin-top:2px}
.hero-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.hero-meta div{min-width:120px}
.hero-meta .eyebrow{display:block;margin-bottom:3px}
.hero-meta p{font-size:13px;color:var(--ink)}
.btn-back{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;
  font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;
}
.btn-back:hover{border-color:var(--line-strong);color:var(--ink)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{
  border:none;background:none;padding:10px 15px;font-size:13.5px;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;
}
.tab .k{font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--faint)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab[aria-selected="true"] .k{color:var(--accent)}

.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.vcard{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 15px;
  display:flex;flex-direction:column;gap:3px;position:relative;
}
.vcard .w{font-family:"Noto Sans KR",sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em}
.vcard .r{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.04em}
.vcard .m{font-size:14px;margin-top:3px}
.vcard .h{font-size:11.5px;color:var(--gold);margin-top:4px;padding-top:5px;border-top:1px dashed var(--line)}
.vcard .pos{
  position:absolute;top:12px;right:12px;font-size:10px;color:var(--faint);
  background:var(--surface-2);border-radius:4px;padding:1px 6px;
}
.vcard-actions{display:flex;gap:6px;margin-top:9px}
.mini{
  border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;
  font-size:11px;color:var(--muted);cursor:pointer;
}
.mini:hover{border-color:var(--accent);color:var(--accent)}

.gram-list{display:flex;flex-direction:column;gap:14px}
.gram{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px}
.gram-form{font-family:"Noto Sans KR",sans-serif;font-size:20px;font-weight:700;color:var(--accent)}
.gram-vi{font-size:14px;color:var(--ink);margin-top:2px;font-weight:400}
.gram-note{font-size:13.5px;color:var(--muted);margin-top:9px;max-width:74ch}
.gram-ex{
  margin-top:12px;background:var(--surface-2);border-radius:8px;padding:11px 14px;
  border-left:3px solid var(--accent);
}
.gram-ex .k{font-family:"Noto Sans KR",sans-serif;font-size:15px;display:block}
.gram-ex .v{font-size:13px;color:var(--muted);margin-top:2px}

.dlg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.dlg-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-row:last-child{border-bottom:none}
.dlg-row:nth-child(odd){background:var(--surface-2)}
.dlg-sp{font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--accent);font-weight:500}
.dlg-ko{font-family:"Noto Sans KR",sans-serif;font-size:16.5px;line-height:1.6}
.dlg-vi{font-size:13px;color:var(--muted);margin-top:3px}
.dlg-bar{display:flex;gap:8px;margin-bottom:14px;align-items:center}

.note-card{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px;
  display:flex;gap:18px;align-items:flex-start;
}
.note-card .mark{
  width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--gold-soft);color:var(--gold);font-family:"Noto Sans KR",sans-serif;font-weight:700;
}
.note-card h4{font-size:15px;margin-bottom:5px}
.note-card p{font-size:13.5px;color:var(--muted);max-width:74ch}

/* ================= tập viết (획순) ================= */
.write-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.jamo-panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px}
.jamo-row-label{display:flex;align-items:baseline;gap:10px;margin:16px 0 10px}
.jamo-row-label:first-child{margin-top:0}
.jamo-row-label h4{font-size:13px;font-weight:500}
.jamo-row-label span{font-size:11.5px;color:var(--faint)}
.jamo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.jbtn{
  aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  font-family:"Noto Sans KR",sans-serif;font-size:24px;font-weight:500;color:var(--ink);cursor:pointer;
  display:grid;place-items:center;
}
.jbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.jbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.stage{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:22px;position:sticky;top:76px}
.stage-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.stage-head .big{font-family:"Noto Sans KR",sans-serif;font-size:26px;font-weight:700}
.stage-head .nm{font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--muted)}
.stage-head .rm{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.06em}

/* ô giấy 원고지 */
.paper{
  position:relative;width:100%;aspect-ratio:1;border:1.5px solid var(--line-strong);
  border-radius:8px;background:var(--surface);overflow:hidden;
}
.paper svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.guide line{stroke:var(--line);stroke-width:.6;stroke-dasharray:3 3}
.guide rect{fill:none;stroke:var(--line);stroke-width:.6}
.glyph path{
  fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.glyph path.ghost{stroke:var(--surface-2)}
.glyph path.ink{stroke:var(--ink)}
.glyph path.live{stroke:var(--seal)}
.glyph path.done{stroke:var(--ink)}
.snum{font-family:"JetBrains Mono",monospace;font-size:7px;fill:var(--seal);font-weight:600}
.snum-bg{fill:var(--surface);stroke:var(--seal);stroke-width:.7}

.stage-ctrl{display:flex;gap:7px;margin-top:14px;align-items:center;flex-wrap:wrap}
.pbtn{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 13px;
  font-size:12.5px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;
}
.pbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.pbtn.primary:hover{filter:brightness(1.1);color:var(--surface)}
.pbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.speed{margin-left:auto;display:flex;gap:3px}
.sp{
  border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);cursor:pointer;
}
.sp[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.stroke-steps{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.stroke-steps h5{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;margin-bottom:9px;font-family:"JetBrains Mono",monospace}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step-dot{
  width:26px;height:26px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);
  font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);cursor:pointer;
}
.step-dot:hover{border-color:var(--seal);color:var(--seal)}
.step-dot[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600}
.tip{
  margin-top:12px;font-size:12.5px;color:var(--muted);background:var(--seal-soft);
  border-radius:8px;padding:10px 12px;border-left:3px solid var(--seal);
}

.builder{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px;margin-top:18px}
.builder h4{font-size:15px;margin-bottom:4px}
.builder>p{font-size:13px;color:var(--muted);margin-bottom:16px;max-width:70ch}
.pick-row{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.pick-label{font-size:12px;color:var(--muted);padding-top:5px}
.pick-label span{display:block;font-family:"Noto Sans KR",sans-serif;font-size:11px;color:var(--faint)}
.pick-opts{display:flex;flex-wrap:wrap;gap:4px}
.pick{
  min-width:32px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  font-family:"Noto Sans KR",sans-serif;font-size:15px;color:var(--ink);cursor:pointer;
}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pick.none{font-family:inherit;font-size:11px;color:var(--faint)}

.trace-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:16px}
.trace-cell{position:relative;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);aspect-ratio:1;overflow:hidden}
.trace-cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.trace-cell .model{position:absolute;inset:0;display:grid;place-items:center;font-family:"Noto Sans KR",sans-serif;font-size:110px;color:var(--line);pointer-events:none;user-select:none;line-height:1}
.trace-cell .lbl{position:absolute;top:6px;left:8px;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--faint);letter-spacing:.1em}

/* ================= ôn tập SRS ================= */
.srs-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
.flash{
  border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--surface);
  padding:36px 28px;text-align:center;box-shadow:var(--shadow);min-height:280px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;
}
.flash .w{font-family:"Noto Sans KR",sans-serif;font-size:52px;font-weight:700;line-height:1.1}
.flash .r{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--faint);letter-spacing:.1em}
.flash .h{font-size:14px;color:var(--gold)}
.flash .m{font-family:"Fraunces","Lexend",serif;font-size:23px;font-weight:600;margin-top:6px}
.flash .p{font-size:12px;color:var(--muted)}
.flash .hint{font-size:12.5px;color:var(--faint);margin-top:12px}
.back{display:none}
.flash.open .back{display:block}
.flash.open .hint{display:none}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grade{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 6px;cursor:pointer;color:var(--ink)}
.grade:hover{border-color:var(--accent);background:var(--accent-soft)}
.grade.again:hover{border-color:var(--seal);background:var(--seal-soft)}
.grade b{display:block;font-size:13px;font-weight:500}
.grade span{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint);margin-top:1px}
.aside-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:15px}
.aside-card h5{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;margin-bottom:11px}
.krow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.krow:last-child{border-bottom:none}
.krow .n{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}

/* ================= từ điển ================= */
.dict-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
.dsearch input{
  width:100%;padding:12px 15px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);font-family:"Noto Sans KR","Lexend",sans-serif;font-size:15.5px;
}
.dhits{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-height:170px;overflow-y:auto;background:var(--surface)}
.dhit{
  display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;padding:9px 14px;
  border:none;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:13.5px;
}
.dhit:last-child{border-bottom:none}
.dhit:hover,.dhit[aria-current="true"]{background:var(--accent-soft)}
.dhit .k{font-family:"Noto Sans KR",sans-serif;font-weight:500;min-width:92px}
.dhit .v{color:var(--muted);font-size:13px}
.dhit .l{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint)}
.entry{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:22px;margin-top:14px}
.entry-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.entry-top .w{font-family:"Noto Sans KR",sans-serif;font-size:34px;font-weight:700}
.chip{font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.entry .rm{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;margin-top:4px}
.entry .def{font-size:17px;margin-top:14px;font-weight:400}
.entry .hj{font-size:13px;color:var(--gold);margin-top:6px}
.entry .from{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.entry-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* ================= bài tập ================= */
.quiz-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:26px;max-width:720px}
.q-stem{font-family:"Noto Sans KR",sans-serif;font-size:25px;font-weight:500;line-height:1.55;margin:10px 0 4px}
.q-stem .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--seal);text-align:center;color:var(--seal)}
.q-hint{font-size:13px;color:var(--muted);margin-bottom:18px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.opt{
  padding:13px 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);
  font-family:"Noto Sans KR",sans-serif;font-size:17px;color:var(--ink);cursor:pointer;text-align:left;
}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--seal-soft);border-color:var(--seal);color:var(--seal)}
.fb{margin-top:16px;padding:14px 16px;border-radius:9px;font-size:13.5px;display:none}
.fb.show{display:block}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong);display:block}
.dots i.done{background:var(--ok)}
.dots i.now{background:var(--seal);transform:scale(1.35)}
.qtypes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.qt{padding:6px 13px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;color:var(--muted);cursor:pointer}
.qt[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}

.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.quiz-score{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.q-prompt{font-size:12.5px;color:var(--faint);margin:2px 0}
.q-stem.q-vi{font-family:"Fraunces","Lexend",serif;font-size:23px;font-weight:600}
.q-rom{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--faint);letter-spacing:.05em}
.q-listen-wrap{padding:16px 0 8px}
.opt.ko{font-family:"Noto Sans KR",sans-serif}
.opt:disabled{opacity:1;cursor:default}
.q-next{display:flex;gap:8px;margin-top:14px}
.q-nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.q-nav .pbtn.primary{margin-left:auto}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.q-explain{margin-top:10px;font-size:13px;line-height:1.6;color:var(--ink);border-top:1px dashed var(--line-strong);padding-top:9px}
.q-explain b{color:var(--accent)}
.q-order-tools{margin-top:10px}
.obuild{min-height:54px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:12px;border:1px dashed var(--line-strong);border-radius:10px;margin:8px 0 12px}
.obuild-ph{font-size:12.5px;color:var(--faint)}
.opool{display:flex;flex-wrap:wrap;gap:7px}
.ochip{font-family:"Noto Sans KR",sans-serif;font-size:16px;padding:8px 13px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.ochip.pool{background:var(--surface-2)}
.ochip:hover{border-color:var(--accent)}
.quiz-done{text-align:center;padding:40px 26px}
.qd-score{font-family:"Fraunces","Lexend",serif;font-size:52px;font-weight:700;color:var(--accent);line-height:1}
.qd-score span{font-size:22px;color:var(--faint);margin-left:6px}
.qd-msg{font-size:15px;color:var(--muted);margin:10px 0 20px}

/* ================= Số đếm ================= */
.num-conv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:22px;max-width:760px}
.num-conv > label{display:block;font-size:12px;color:var(--faint);margin-bottom:9px}
.num-conv-row{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
.num-conv input{flex:0 0 160px;padding:10px 13px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:16px;font-family:"JetBrains Mono",monospace}
.num-out{flex:1;min-width:220px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.no-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.no-tag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-soft);border-radius:99px;padding:1px 8px}
.no-line .ko{font-family:"Noto Sans KR",sans-serif;font-size:20px;font-weight:600}
.no-note{font-size:12.5px;color:var(--faint)}
.num-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.num-chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer}
.num-chip:hover{border-color:var(--accent)}
.num-chip .num-n{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint)}
.num-chip .num-ko{font-family:"Noto Sans KR",sans-serif;font-size:17px;font-weight:600}
.num-sec-title{margin:26px 0 12px}
.num-sec-title h2{font-family:"Fraunces","Lexend",serif;font-size:20px;font-weight:600}
.num-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:820px}
.num-row{display:grid;grid-template-columns:66px 132px 1fr 1fr 40px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.num-row:first-child{border-top:none}
.nr-u{font-family:"Noto Sans KR",sans-serif;font-size:18px;font-weight:600}
.nr-vi{font-size:12.5px;color:var(--muted)}
.nr-ex{font-family:"Noto Sans KR",sans-serif;font-size:15px}
.nr-exvi{font-size:12px;color:var(--faint)}
.num-use{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-width:900px}
.nu-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.nu-card h5{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.nu-ko{font-family:"Noto Sans KR",sans-serif;font-size:20px;font-weight:600;margin:0}
.nu-vi{font-size:12.5px;color:var(--muted);margin:5px 0 10px}
@media (max-width:640px){
  .num-row{grid-template-columns:52px 1fr 40px}
  .num-row .nr-vi,.num-row .nr-exvi{display:none}
}

/* ================= Thi thử TOPIK ================= */
.topik-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:900px}
.topik-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.tk-badge{align-self:flex-start;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 11px}
.topik-card h3{font-family:"Fraunces","Lexend",serif;font-size:18px;font-weight:600;margin:4px 0 0}
.tk-meta{font-size:13px;color:var(--ink)}
.tk-official{font-size:12px;color:var(--faint);margin-bottom:6px}
.topik-card .pbtn{align-self:flex-start;margin-top:4px}
.tk-disclaimer{font-size:12px;color:var(--faint);margin-top:20px;max-width:760px;line-height:1.5}
.topik-bar{position:sticky;top:56px;z-index:16;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;box-shadow:0 6px 18px -14px rgba(0,0,0,.4)}
.tk-bar-info b{display:block;font-size:14px}
.tk-timer{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.tk-timer.low{color:var(--seal);animation:tkpulse 1s infinite}
.tk-timer.paused{color:var(--faint);opacity:.6;animation:none}
.tk-bar-btns{display:flex;gap:8px;flex-wrap:wrap}
@keyframes tkpulse{50%{opacity:.45}}
.topik-quiz{display:flex;flex-direction:column;gap:16px;max-width:760px}
.tk-q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px}
.tk-q-no{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk-tag{background:var(--surface-2);border-radius:99px;padding:1px 8px;color:var(--muted)}
.tk-passage{background:var(--surface-2);border-left:3px solid var(--accent-soft);border-radius:8px;padding:12px 14px;font-family:"Noto Sans KR",sans-serif;font-size:15px;line-height:1.7;margin-bottom:6px}
.tk-q .pbtn{margin-bottom:10px}
.tk-q-text{font-family:"Noto Sans KR",sans-serif;font-size:16px;font-weight:500;margin:8px 0 12px;line-height:1.5}
.tk-opts{display:flex;flex-direction:column;gap:8px}
.tk-opt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 13px;cursor:pointer;font-size:14px;color:var(--ink);width:100%}
button.tk-opt:hover{border-color:var(--accent)}
.tk-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.tk-opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.tk-opt.wrong{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.tk-onum{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:11px}
.tk-explain{margin-top:11px;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 13px;line-height:1.55}
.tk-ok{color:var(--ok);font-weight:600}
.tk-no{color:var(--seal);font-weight:600}
.topik-foot{max-width:760px;margin-top:18px;display:flex;justify-content:center}
.review .tk-opt{cursor:default}
.tk-passage{white-space:pre-line}
.tk-section{max-width:760px;margin:6px 0 -4px;padding:11px 14px;background:var(--ink);color:var(--ground);border-radius:9px}
.tk-sec-ko{display:block;font-family:"Noto Sans KR",sans-serif;font-size:13.5px;font-weight:600}
.tk-sec-vi{display:block;font-size:11.5px;opacity:.8;margin-top:2px}
.tk-note-small{font-size:12px;color:var(--faint);margin-top:8px}
.tk-list-title{font-family:"Fraunces","Lexend",serif;font-size:20px;font-weight:600;margin:26px 0 14px}
.tk-guide{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:900px;margin-bottom:8px}
.tkg-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px}
.tkg-card.wide{grid-column:1 / -1}
.tkg-card h4{font-family:"Fraunces","Lexend",serif;font-size:15px;font-weight:600;margin:0 0 9px}
.tkg-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 7px}
.tkg-card ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.65}
.tkg-card li{margin-bottom:4px}
.tkg-table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:4px 0 10px}
.tkg-row{display:grid;grid-template-columns:1.4fr 1fr .6fr 1.2fr;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.tkg-row:first-child{border-top:none}
.tkg-row.head{background:var(--surface-2);font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.tkg-row.total{background:var(--gold-soft);font-weight:600}
.tkg-row small{color:var(--faint);font-weight:400}
.tkg-note{font-size:12px;color:var(--faint);line-height:1.55;margin:0}
@media (max-width:720px){
  .tk-guide{grid-template-columns:1fr}
  .tkg-row{grid-template-columns:1.3fr 1fr .5fr 1.1fr;font-size:11.5px}
}

.empty{
  border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:40px;text-align:center;
  color:var(--muted);font-size:13.5px;background:var(--surface);
}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:99px;font-size:13px;
  box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:80;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= một mục từ điển ================= */
.dict-entry{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px}
.de-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.de-word{font-family:"Noto Sans KR",sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.de-rom{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--faint);letter-spacing:.06em}
.de-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.de-meta .chip.lv{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.de-meta .chip.soft{color:var(--faint)}

.de-struct{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:14px;
  padding:11px 13px;background:var(--gold-soft);border-radius:9px}
.de-struct .de-lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.de-struct .de-hanja{font-family:"Fraunces","Noto Sans KR",serif;font-size:20px;color:var(--gold);letter-spacing:.1em}
.de-struct .de-note{font-size:12px;color:var(--muted);flex:1;min-width:180px}
.de-struct .de-note b{color:var(--ink)}

.de-senses{margin:16px 0 0;padding:0;list-style:none;counter-reset:sense}
.de-senses > li{position:relative;padding:0 0 14px 30px;margin-bottom:14px;border-bottom:1px solid var(--line);counter-increment:sense}
.de-senses > li:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.de-senses > li::before{content:counter(sense);position:absolute;left:0;top:1px;
  width:21px;height:21px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;display:grid;place-items:center}
.de-vi{font-size:16px;font-weight:500;line-height:1.5}
.de-ko{font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6;font-weight:400}
.de-ex-list{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.de-ex{background:var(--surface-2);border-radius:8px;padding:8px 11px;border-left:2px solid var(--accent-soft)}
.de-ex .ko{font-family:"Noto Sans KR",sans-serif;font-size:14px;line-height:1.55;display:block}
.de-ex-vi{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.de-usage{margin-top:16px}

/* ============================================================
   Ghép âm tiết (음절 조합)
   Một âm tiết = 초성 (phụ âm đầu) + 중성 (nguyên âm) + 종성 (patchim, tuỳ chọn)
   ============================================================ */

const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNGSEONG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONGSEONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

/* Patchim ghép → tách thành các chữ cái đơn để vẽ nét */
const JONG_SPLIT = {
  'ㄳ':['ㄱ','ㅅ'], 'ㄵ':['ㄴ','ㅈ'], 'ㄶ':['ㄴ','ㅎ'], 'ㄺ':['ㄹ','ㄱ'],
  'ㄻ':['ㄹ','ㅁ'], 'ㄼ':['ㄹ','ㅂ'], 'ㄽ':['ㄹ','ㅅ'], 'ㄾ':['ㄹ','ㅌ'],
  'ㄿ':['ㄹ','ㅍ'], 'ㅀ':['ㄹ','ㅎ'], 'ㅄ':['ㅂ','ㅅ']
};

function composeHangul(cho, jung, jong){
  const ci = CHOSEONG.indexOf(cho), vi = JUNGSEONG.indexOf(jung), ti = JONGSEONG.indexOf(jong || '');
  if (ci < 0 || vi < 0 || ti < 0) return '';
  return String.fromCharCode(0xAC00 + (ci * 21 + vi) * 28 + ti);
}

function decomposeHangul(ch){
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return null;
  return {
    cho : CHOSEONG[Math.floor(code / 588)],
    jung: JUNGSEONG[Math.floor((code % 588) / 28)],
    jong: JONGSEONG[code % 28]
  };
}

/* Vị trí từng thành phần trong ô vuông 100×100, tuỳ hình dạng nguyên âm.
   Trả về [scaleX, scaleY, offsetX, offsetY] */
function blockLayout(jung, hasJong){
  const shape = (JAMO[jung] && JAMO[jung].shape) || 'vertical';
  if (shape === 'vertical'){          // ㅏ ㅓ ㅣ … nguyên âm đứng bên phải
    return hasJong
      ? { cho:[.52,.55, 3, 4], jung:[.44,.55, 55, 4], jong:[.86,.35, 7, 63] }
      : { cho:[.58,.86, 2, 7], jung:[.46,.86, 55, 7] };
  }
  if (shape === 'horizontal'){        // ㅗ ㅜ ㅡ … nguyên âm nằm bên dưới
    return hasJong
      ? { cho:[.56,.34, 22, 0], jung:[.90,.62, 5, 20], jong:[.80,.34, 10, 63] }
      : { cho:[.64,.46, 18, 2], jung:[.92,.82, 4, 26] };
  }
  // ㅘ ㅝ ㅢ … phần ngang xuống dưới bên trái, phần đứng dựng bên phải
  return hasJong
    ? { cho:[.42,.34, 4, 2], jungH:[.86,.34, 2, 26], jungV:[.94,.66, 4, 2], jong:[.80,.32, 10, 65] }
    : { cho:[.46,.46, 4, 4], jungH:[.88,.55, 2, 40], jungV:[1, 1, 4, 0] };
}

/* Sinh danh sách nét cho một âm tiết hoàn chỉnh.
   Mỗi phần tử: { d, part, label } — d đã được biến đổi sẵn về khung 100×100. */
function syllableStrokes(ch){
  const parts = decomposeHangul(ch);
  if (!parts) return [];
  const L = blockLayout(parts.jung, !!parts.jong);
  const out = [];

  const push = (jamo, box, part, from, to) => {
    if (!jamo || !JAMO[jamo]) return;
    const [sx, sy, ox, oy] = box;
    JAMO[jamo].strokes.slice(from || 0, to === undefined ? Infinity : to).forEach(d => out.push({
      d, part, jamo,
      transform: `translate(${ox} ${oy}) scale(${sx} ${sy})`
    }));
  };

  push(parts.cho, L.cho, 'cho');
  if (L.jungH){                              // nguyên âm ghép hai phía: tách làm hai
    const k = JAMO[parts.jung].split || 2;
    push(parts.jung, L.jungH, 'jung', 0, k);
    push(parts.jung, L.jungV, 'jung', k);
  } else {
    push(parts.jung, L.jung, 'jung');
  }
  if (parts.jong){
    const split = JONG_SPLIT[parts.jong];
    if (split){
      const [sx, sy, ox, oy] = L.jong;
      split.forEach((j, i) => push(j, [sx * .46, sy, ox + i * sx * 52, oy], 'jong'));
    } else {
      push(parts.jong, L.jong, 'jong');
    }
  }
  return out;
}

function mergeExtra(levelId, extraMap){
  COURSE_KO.lessons.forEach(l => {
    if (l.level === levelId && extraMap && extraMap[l.no]){
      const ex = extraMap[l.no];
      (ex.grammar || []).forEach(g => { if (!l.grammar.some(x => x.form === g.form)) l.grammar.push(g); });
      (ex.vocab || []).forEach(v => { if (!l.vocab.some(x => x.ko === v.ko)) l.vocab.push(v); });
    }
  });
}

<script>
/* ============================================================
   LangLab — audio thu sẵn cho từng từ và từng câu
   ------------------------------------------------------------
   Giọng đọc của trình duyệt (Web Speech API) phụ thuộc vào giọng
   cài trên máy, và trên Windows thường là giọng cũ, nghe rất máy.
   Cách chắc chắn: thu sẵn mọi từ và mọi câu thành mp3 bằng giọng
   neural, rồi app chỉ việc phát tệp.

   Chạy `python tools/make_audio.py` một lần để sinh thư mục
   audio/tts/. Sau đó mọi thao tác nghe trong app đều dùng tệp thu
   sẵn; giọng máy chỉ còn là phương án dự phòng.

   Tên tệp = băm FNV-1a 32 bit của câu đã chuẩn hoá, tính giống
   nhau ở cả JS và Python nên hai bên luôn khớp.
   ============================================================ */

const TTS = (function(){
'use strict';

const ROOTS = ['audio/tts/', '../audio/tts/'];

/** Chuẩn hoá trước khi băm — phải giống hệt hàm norm() trong make_audio.py */
function norm(s){
  return String(s).replace(/\s+/g, ' ').trim();
}

function hash(s){
  const t = norm(s);
  let bytes;
  if (typeof TextEncoder !== 'undefined') bytes = new TextEncoder().encode(t);
  else bytes = unescape(encodeURIComponent(t)).split('').map(c => c.charCodeAt(0));
  let h = 0x811c9dc5;
  for (let i = 0; i < bytes.length; i++){
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('0000000' + h.toString(16)).slice(-8);
}

const file = (s, k) => ROOTS[(k || 0) % ROOTS.length] + hash(s) + '.mp3';

/* ---------- ba tầng nguồn audio ----------
   1. tệp thu sẵn audio/tts/<băm>.mp3   — nhanh nhất, chạy offline
   2. máy chủ cục bộ /_tts?text=…       — đọc được MỌI văn bản, tự lưu vào tầng 1
   3. giọng máy của trình duyệt         — chỉ khi hai tầng trên đều không có     */

let el = null, root = 0, tried = 0, missing = {};
let currentRate = 1;
let server = null;                 // null = chưa dò, false = không có, true = có

const serverUrl = t => '/_tts?text=' + encodeURIComponent(norm(t));

function ensure(){
  if (el) return el;
  el = new Audio();
  el.preload = 'none';
  return el;
}

/**
 * Phát câu bằng tệp thu sẵn. Nếu không có tệp, gọi onFail() để
 * màn hình tự chuyển sang giọng máy.
 */
function play(text, opts){
  opts = opts || {};
  const key = hash(text);
  const a = ensure();
  a.pause();
  currentRate = opts.rate || 1;
  a.onended = () => { opts.onEnd && opts.onEnd(); };

  // đã biết không có tệp tĩnh: đi thẳng máy chủ, hoặc nhường cho giọng máy
  if (missing[key]) return fromServer(text, opts);

  tried = 0;
  const start = src => {
    a.src = src;
    a.playbackRate = currentRate;
    const p = a.play();
    if (p && p.catch) p.catch(a.onerror);
  };
  const fail = () => {
    if (tried < ROOTS.length - 1){ tried++; root = (root + 1) % ROOTS.length; start(file(text, root)); return; }
    missing[key] = 1;                       // lần sau khỏi dò lại cho nhanh
    fromServer(text, opts);
  };
  a.onerror = fail;
  start(file(text, root));
  return true;
}

/** Nhờ máy chủ cục bộ tổng hợp — chỗ này mới là thứ đọc được văn bản tuỳ ý. */
function fromServer(text, opts){
  if (server === false){ opts.onFail && opts.onFail(); return false; }
  const a = ensure();
  a.onerror = () => { server = false; opts.onFail && opts.onFail(); };
  a.onended = () => { opts.onEnd && opts.onEnd(); };
  a.src = serverUrl(text);
  a.playbackRate = opts.rate || 1;
  const p = a.play();
  if (p && p.catch) p.catch(() => { server = false; opts.onFail && opts.onFail(); });
  return true;
}

/** Đọc bất kỳ đoạn văn nào: tách câu rồi phát lần lượt. Dùng cho luyện shadowing. */
function speakText(text, opts){
  opts = opts || {};
  const parts = String(text)
    .split(/(?:\r?\n)+/).join(' ')
    .match(/[^.!?…。？！]+[.!?…。？！]*/g) || [];
  const lines = parts.map(s => norm(s)).filter(s => s.length);
  if (!lines.length) return false;
  return playSeq(lines, opts);
}

function stop(){
  seqToken++;
  if (el){ el.pause(); el.onerror = null; el.onended = null; }
}

/* ---------- phát liên tiếp nhiều câu (hội thoại) ---------- */
let seqToken = 0;

function playSeq(lines, opts){
  opts = opts || {};
  stop();
  const mine = ++seqToken;
  let i = 0;
  const step = () => {
    if (mine !== seqToken) return;
    if (i >= lines.length){ opts.onEnd && opts.onEnd(); return; }
    const idx = i;
    opts.onLine && opts.onLine(idx);
    play(lines[idx], {
      rate: opts.rate || 1,
      onEnd(){ if (mine !== seqToken) return; i++; setTimeout(step, opts.gap || 550); },
      onFail(){
        if (mine !== seqToken) return;
        if (idx === 0){ opts.onFail && opts.onFail(); return; }   // chưa thu → nhường cho giọng máy
        i++; setTimeout(step, 120);
      }
    });
  };
  step();
  return true;
}

/* ---------- dò xem đang có nguồn nào ---------- */
let probed = null;
const PROBE = '안녕하세요';
/* Dò bằng nhiều từ, vì chỉ cần một tệp lẻ bị thiếu là kết luận sai toàn bộ. */
const PROBE_WORDS = ['도서관', '학교', '친구', '안녕하세요'];

/** Dò tệp tĩnh (không cần mạng, không cần fetch — dùng chính thẻ audio). */
function probeStatic(cb){
  if (probed !== null){ cb(probed); return; }

  const queue = [];
  ROOTS.forEach((_, k) => PROBE_WORDS.forEach(w => queue.push([w, k])));

  let i = 0, settled = false;
  const a = new Audio();
  a.preload = 'metadata';
  const done = v => { if (settled) return; settled = true; probed = v; cb(v); };
  const next = () => {
    if (i >= queue.length){ done(false); return; }
    const [w, k] = queue[i++];
    root = k;
    a.src = file(w, k);
  };
  a.addEventListener('loadedmetadata', () => done(true));
  a.addEventListener('error', next);
  next();
  setTimeout(() => done(false), 5000);
}

/** Dò máy chủ cục bộ. Chỉ gọi khi trang được mở qua http(s). */
function probeServer(cb){
  if (server !== null){ cb(server); return; }
  if (!/^https?:$/.test(location.protocol)){ server = false; cb(false); return; }
  const done = v => { if (server === null){ server = v; cb(v); } };
  const t = setTimeout(() => done(false), 2500);
  const a = new Audio();
  a.preload = 'metadata';
  a.addEventListener('loadedmetadata', () => { clearTimeout(t); done(true); });
  a.addEventListener('error', () => { clearTimeout(t); done(false); });
  a.src = serverUrl(PROBE);
}

/** Trạng thái gộp: { statics, server } */
function probe(cb){
  let s1 = null, s2 = null;
  const fire = () => { if (s1 !== null && s2 !== null) cb({ statics: s1, server: s2 }); };
  probeStatic(v => { s1 = v; fire(); });
  probeServer(v => { s2 = v; fire(); });
}

function ready(){ return probed === true || server === true; }
function hasServer(){ return server === true; }

return { hash, file, play, playSeq, speakText, stop, ready, probe, hasServer, norm, roots: ROOTS };
})();
if (typeof window !== 'undefined') window.TTS = TTS;

</script>

   URL này KHÔNG phải bí mật — khoá API nằm an toàn trong secret của
   Worker, không nằm ở đây.

<script>
/* ============================================================
   LangLab — bản dịch tiếng Việt cho đoạn văn tự dán
   ------------------------------------------------------------
   Máy dịch xử lý từng câu rời rạc nên hay ra thứ tiếng Việt dịch sát
   từng chữ. Ở đây cả đoạn được gửi một lượt cho LLM qua máy chủ cục bộ
   (tools/translate.py), nên bản dịch có ngữ cảnh và nghe tự nhiên hơn.

   Chỉ hoạt động khi mở LangLab qua máy chủ (chay.bat). Mở bằng file://
   thì phần này tắt, app vẫn chạy bình thường.
   ============================================================ */

const Translate = (function(){
'use strict';

const online = () => /^https?:$/.test(location.protocol);

/* băm giống hệt js/tts.js và tools/make_audio.py */
function hash(s){
  const t = String(s).replace(/\s+/g, ' ').trim();
  const bytes = (typeof TextEncoder !== 'undefined')
    ? new TextEncoder().encode(t)
    : unescape(encodeURIComponent(t)).split('').map(c => c.charCodeAt(0));
  let h = 0x811c9dc5;
  for (let i = 0; i < bytes.length; i++){
    h ^= bytes[i];
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('0000000' + h.toString(16)).slice(-8);
}

let cfg = null;          // null = chưa hỏi, {ok:…} = đã biết
let base = null;         // nơi gọi được: '' = cùng gốc (serve.py), hoặc URL Worker

/* Các nơi có thể xử lý việc dịch, thử theo thứ tự:
   1. cùng gốc  '/_translate'      — máy chủ cục bộ khi mở bằng chay.bat
   2. Cloudflare Worker            — khi app đã đưa lên mạng (điền ở js/config.js) */
function endpoints(){
  const list = [];
  if (online()) list.push('');                    // máy chủ cục bộ, chỉ khi mở qua http
  const w = (window.LANGLAB_CONFIG && window.LANGLAB_CONFIG.translateWorker || '').trim().replace(/\/$/, '');
  if (w) list.push(w);                            // Worker là URL đầy đủ nên gọi được cả khi mở file://
  return list;
}

function status(cb){
  if (cfg){ cb(cfg); return; }
  const eps = endpoints();
  if (!eps.length){ cfg = { ok:false, reason:'offline' }; cb(cfg); return; }

  let i = 0;
  const tryNext = () => {
    if (i >= eps.length){ cfg = { ok:false, reason:'no-server' }; cb(cfg); return; }
    const ep = eps[i++];
    fetch(ep + '/_translate/status')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(j => { if (j && j.ok){ base = ep; cfg = j; cb(j); } else { tryNext(); } })
      .catch(tryNext);
  };
  tryNext();
}

/**
 * Dịch cả đoạn một lượt.
 * cb(map, err) — map là { băm câu: bản dịch }
 */
function run(sentences, cb){
  const eps = base !== null ? [base] : endpoints();
  if (!eps.length){ cb({}, 'offline'); return; }

  let i = 0;
  const tryNext = (lastErr) => {
    if (i >= eps.length){ cb({}, lastErr || 'no-server'); return; }
    const ep = eps[i++];
    fetch(ep + '/_translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sentences: sentences })
    })
      .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
      .then(j => { base = ep; cb(j.translations || {}, j.error || null); })
      .catch(e => tryNext(String(e && e.message || e)));
  };
  tryNext();
}

/** Mở cả đoạn trong Google Dịch — phương án cho người chưa có khoá API. */
function googleUrl(text){
  return 'https://translate.google.com/?sl=ko&tl=vi&op=translate&text='
       + encodeURIComponent(String(text).slice(0, 4500));
}

return { hash, status, run, googleUrl, online };
})();
if (typeof window !== 'undefined') window.Translate = Translate;

</script>
<script>
/* ============================================================
   LangLab — engine phát âm tiếng Hàn
   ------------------------------------------------------------
   Web Speech API mặc định đọc rất giật vì ba lý do:
     1. trình duyệt tự chọn giọng, nhiều khi không phải giọng Hàn;
     2. cả đoạn dài được đẩy vào một lần nên máy ngắt nghỉ tuỳ tiện;
     3. Chrome có lỗi: gọi speak() ngay sau cancel() sẽ bị nuốt tiếng,
        và tự dừng sau khoảng 15 giây.
   Module này xử lý cả ba: chọn đúng giọng ko-KR, cắt câu theo dấu
   rồi phát thành hàng đợi có khoảng nghỉ, và giữ nhịp cho Chrome.
   ============================================================ */

const Speech = (function(){
'use strict';

const SUPPORTED = typeof window !== 'undefined' && 'speechSynthesis' in window;

const cfg = {
  voiceURI: null,
  rate: 0.9,
  pitch: 1,
  gapSentence: 420,   // nghỉ giữa hai câu (ms)
  gapClause: 200,     // nghỉ ở dấu phẩy
  gapLine: 650        // nghỉ giữa hai lượt thoại
};
try {
  const saved = JSON.parse(localStorage.getItem('langlab.speech') || '{}');
  Object.assign(cfg, saved);
} catch(e){}
function save(){ try { localStorage.setItem('langlab.speech', JSON.stringify({
  voiceURI: cfg.voiceURI, rate: cfg.rate, pitch: cfg.pitch })); } catch(e){} }

let voices = [], readyCbs = [], loaded = false;

function loadVoices(){
  if (!SUPPORTED) return;
  const list = speechSynthesis.getVoices();
  if (!list.length) return;
  voices = list;
  if (!loaded){ loaded = true; readyCbs.splice(0).forEach(fn => { try { fn(); } catch(e){} }); }
}
if (SUPPORTED){
  loadVoices();
  speechSynthesis.addEventListener('voiceschanged', loadVoices);
  // Safari đôi khi không bắn voiceschanged — thử lại vài nhịp
  let tries = 0;
  const t = setInterval(() => { loadVoices(); if (loaded || ++tries > 20) clearInterval(t); }, 250);
}

function korean(){ return voices.filter(v => /^ko(-|_|$)/i.test(v.lang)); }

/** Giọng đang dùng: giọng người học đã chọn, nếu không thì giọng Hàn tốt nhất. */
function current(){
  const ko = korean();
  if (!ko.length) return null;
  if (cfg.voiceURI){
    const found = ko.find(v => v.voiceURI === cfg.voiceURI);
    if (found) return found;
  }
  // Giọng "online/neural" của Edge và Google thường tự nhiên hơn giọng cài sẵn
  const score = v => (/google/i.test(v.name) ? 3 : 0)
                   + (/natural|neural|online/i.test(v.name) ? 3 : 0)
                   + (!v.localService ? 1 : 0);
  return ko.slice().sort((a, b) => score(b) - score(a))[0];
}

/* ---------- cắt câu ---------- */
function splitKeep(text, enders){
  const out = []; let buf = '';
  for (const ch of text){
    buf += ch;
    if (enders.indexOf(ch) > -1){ if (buf.trim()) out.push(buf.trim()); buf = ''; }
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}

/** Trả về danh sách mẩu {t, gap} — mỗi mẩu là một hơi đọc. */
function chunk(text){
  const clean = String(text)
    .replace(/\([^)]*\)/g, ' ')     // bỏ phần trong ngoặc (phiên âm, chú thích)
    .replace(/[""''«»]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!clean) return [];
  const out = [];
  splitKeep(clean, ['.', '!', '?', '…', '。', '！', '？']).forEach(sent => {
    // câu ngắn đọc liền một hơi; câu dài mới cắt tiếp ở dấu phẩy
    if (sent.length <= 15 || sent.search(/[,、;:·]/) < 0){ out.push({ t: sent, gap: cfg.gapSentence }); return; }
    const parts = splitKeep(sent, [',', '、', ';', ':', '·']);
    parts.forEach((p, i) => out.push({ t: p, gap: i === parts.length - 1 ? cfg.gapSentence : cfg.gapClause }));
  });
  return out;
}

/* ---------- hàng đợi phát ---------- */
let token = 0, keepAlive = null, listeners = [];

function emit(ev, data){ listeners.forEach(fn => { try { fn(ev, data); } catch(e){} }); }
function onEvent(fn){ listeners.push(fn); }

function stop(){
  token++;
  if (keepAlive){ clearInterval(keepAlive); keepAlive = null; }
  if (SUPPORTED) speechSynthesis.cancel();
  emit('stop');
}

function play(items, opts){
  opts = opts || {};
  if (!SUPPORTED){ emit('unsupported'); return; }
  stop();
  const mine = ++token;
  const voice = current();

  // Chrome tự dừng sau ~15 giây im lặng nội bộ — nhịp resume này giữ cho nó chạy tiếp
  keepAlive = setInterval(() => {
    if (speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume();
  }, 6000);

  let i = 0;
  const step = () => {
    if (mine !== token) return;
    if (i >= items.length){
      if (keepAlive){ clearInterval(keepAlive); keepAlive = null; }
      emit('end');
      try { opts.onEnd && opts.onEnd(); } catch(err){}
      return;
    }
    const it = items[i];
    emit('chunk', it);
    // lỗi trong callback của màn hình không được phép làm đứt mạch đọc
    try { opts.onChunk && opts.onChunk(it, i); } catch(err){}

    const u = new SpeechSynthesisUtterance(it.t);
    u.lang  = 'ko-KR';
    u.rate  = opts.rate || cfg.rate;
    u.pitch = cfg.pitch;
    u.volume = 1;
    if (voice) u.voice = voice;

    let moved = false;
    const next = () => {
      if (moved || mine !== token) return;
      moved = true; i++;
      setTimeout(step, it.gap || cfg.gapSentence);
    };
    u.onend = next;
    u.onerror = next;
    // phòng trường hợp engine câm lặng: ước lượng thời lượng rồi tự đi tiếp
    const guard = Math.max(2500, it.t.length * 280 / (opts.rate || cfg.rate));
    setTimeout(next, guard);

    speechSynthesis.speak(u);
  };
  // Chrome nuốt tiếng nếu speak() gọi ngay sau cancel() — chờ một nhịp ngắn
  setTimeout(step, 120);
}

/** Đọc một câu / một cụm. */
function speak(text, opts){ play(chunk(text), opts); }

/** Đọc nhiều lượt thoại liên tiếp, nghỉ dài hơn giữa các lượt. */
function speakLines(lines, opts){
  opts = opts || {};
  const items = [];
  const lineGap = opts.gap || cfg.gapLine;
  lines.forEach((ln, li) => {
    const cs = chunk(typeof ln === 'string' ? ln : ln.text);
    cs.forEach((c, ci) => {
      c.line = li;
      if (ci === cs.length - 1) c.gap = lineGap;
      items.push(c);
    });
  });
  play(items, opts);
}

return {
  supported: SUPPORTED,
  cfg,
  save,
  voices: () => voices,
  koVoices: korean,
  currentVoice: current,
  hasKorean: () => korean().length > 0,
  onReady: fn => { if (loaded) fn(); else readyCbs.push(fn); },
  onEvent,
  chunk,
  speak,
  speakLines,
  stop
};
})();
if (typeof window !== 'undefined') window.Speech = Speech;

</script>
<script>
/* ============================================================
   LangLab — xử lý từ tiếng Hàn
   ------------------------------------------------------------
   · Tách mọi câu tiếng Hàn thành các từ bấm được
   · Gỡ trợ từ và đuôi chia để đoán dạng gốc (dạng tra từ điển)
   · Tìm câu ví dụ có chứa từ đó ngay trong khoá học
   · Sinh link nhảy sang các từ điển ngoài (đã kiểm chứng thủ công)
   ============================================================ */

const Words = (function(){
'use strict';

const HANGUL = '가-힣㄰-㆏';
const RE_TOKEN = new RegExp('^([^' + HANGUL + ']*)([' + HANGUL + ']+)([^' + HANGUL + ']*)$');
const RE_HAS   = new RegExp('[' + HANGUL + ']');

const escHtml = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** Bọc từng từ tiếng Hàn trong <span class="kw"> để rê chuột và bấm được. */
function mark(text){
  return String(text).split(/(\s+)/).map(seg => {
    if (!seg.trim()) return seg;
    if (!RE_HAS.test(seg)) return escHtml(seg);
    const m = seg.match(RE_TOKEN);
    if (!m) return escHtml(seg);
    return escHtml(m[1])
      + '<span class="kw" data-kw="' + escHtml(m[2]) + '" tabindex="0" role="button">' + escHtml(m[2]) + '</span>'
      + escHtml(m[3]);
  }).join('');
}

/* ---------- gỡ trợ từ và đuôi chia ---------- */

/* Trợ từ (조사) — dính vào danh từ. Xếp dài trước để cắt cụm dài nhất. */
const PARTICLES = [
  '으로부터','로부터','에게서','한테서','에서는','에게도','으로는','이라고','이에요',
  '에서','께서','에게','한테','부터','까지','마다','처럼','보다','밖에','조차','이나',
  '으로','에는','에도','하고','이랑','라고','예요',
  '와','과','은','는','이','가','을','를','도','에','의','로','만','께','랑'
];

/* Đuôi bắt đầu bằng nguyên âm hoà (아/어/여/해) — cần xử lý riêng. */
const HARMONY_ENDINGS = ['요', '서'];

/* Đuôi còn lại: bỏ đuôi rồi thêm 다 là ra dạng gốc. */
const PLAIN_ENDINGS = [
  '았습니다','었습니다','였습니다','겠습니다','습니다','습니까',
  '으려고','으니까','으세요','는데요','은데요','읍시다',
  '니다','니까','시다','지만','으면','는데','은데','으러','려고','네요','나요',
  '고','지','게','는','면','러','며'
];

const jong = ch => { const p = (typeof decomposeHangul === 'function') && decomposeHangul(ch); return p ? p.jong : ''; };
const dropJong = ch => {
  const p = (typeof decomposeHangul === 'function') && decomposeHangul(ch);
  return p && p.jong ? composeHangul(p.cho, p.jung, '') : ch;
};
/* Gỡ hiện tượng co nguyên âm khi chia thì: 봐→보, 와→오, 줘→주, 돼→되, 해→하 */
const UNCONTRACT = { 'ㅘ':'ㅗ', 'ㅝ':'ㅜ', 'ㅙ':'ㅚ', 'ㅞ':'ㅜ' };
function uncontract(ch){
  if (ch === '해') return '하';
  const p = (typeof decomposeHangul === 'function') && decomposeHangul(ch);
  if (!p || p.jong || !UNCONTRACT[p.jung]) return null;
  return composeHangul(p.cho, UNCONTRACT[p.jung], '');
}
/* Bất quy tắc ㅡ (으 탈락): 뻐→쁘, 빠→쁘, 커→크, 퍼→프. Âm tiết kết bằng ㅏ/ㅓ,
   không patchim → khôi phục nguyên âm ㅡ để ra dạng gốc (예쁘다, 바쁘다, 아프다, 크다…). */
function restoreEu(ch){
  const p = (typeof decomposeHangul === 'function') && decomposeHangul(ch);
  if (!p || p.jong || (p.jung !== 'ㅏ' && p.jung !== 'ㅓ')) return null;
  return composeHangul(p.cho, 'ㅡ', '');
}

/** Sinh các dạng có thể tra được, xếp theo độ tin cậy. */
function forms(token){
  const out = [], seen = {};
  const add = (f, why, kind) => {
    if (!f || f.length < 1 || seen[f]) return;
    seen[f] = 1; out.push({ form: f, why: why, kind: kind || 'other' });
  };
  add(token, 'nguyên dạng trong câu', 'surface');

  /* --- động từ / tính từ --- */
  // (1) đuôi hoà âm: …아요 / …어요 / …해요 / …아서 …
  for (const e of HARMONY_ENDINGS){
    if (token.length <= e.length || token.slice(-e.length) !== e) continue;
    let s = token.slice(0, -e.length);              // 일어나 · 맛있어 · 공부해 · 갔어 · 앉으세
    if (/해$/.test(s)){
      add(s.slice(0, -1) + '하다', 'dạng gốc …하다', 'base');
    } else if (/[으]?세$/.test(s)){                  // -(으)세요 lịch sự
      add(s.replace(/으?세$/, '') + '다', 'dạng gốc …다', 'base');
    } else if (/[아어여]$/.test(s)){
      const core = s.slice(0, -1);                  // 맛있 · 갔 · 읽었
      const last = core.slice(-1);
      if (/[았었였]$/.test(last)){                    // đuôi quá khứ nguyên âm tiết
        add(core.slice(0, -1) + '다', 'dạng gốc, bỏ đuôi quá khứ', 'base');
      } else if (jong(last) === 'ㅆ' && last !== '있' && last !== '없'){
        const bare = dropJong(last);                 // 봤→봐 · 왔→와 · 했→해 · 갔→가
        const un = uncontract(bare);                 // 봐→보 · 와→오 · 해→하
        if (un) add(core.slice(0, -1) + un + '다', 'dạng gốc, gỡ đuôi quá khứ', 'base');
        add(core.slice(0, -1) + bare + '다', 'dạng gốc, bỏ đuôi quá khứ', 'base');
        const eu = restoreEu(bare);                  // 예뻤→예쁘 · 바빴→바쁘 · 컸→크
        if (eu) add(core.slice(0, -1) + eu + '다', 'dạng gốc bất quy tắc ㅡ', 'base');
      }
      add(core + '다', 'dạng gốc …다', 'base');
    } else {
      const un = uncontract(s.slice(-1));           // 바꿔→바꾸 · 봐→보 · 와→오
      if (un) add(s.slice(0, -1) + un + '다', 'dạng gốc, gỡ nguyên âm co', 'base');
      add(s + '다', 'dạng gốc …다', 'base');
      const eu = restoreEu(s.slice(-1));            // 예뻐→예쁘 · 바빠→바쁘 · 커→크 · 아파→아프
      if (eu) add(s.slice(0, -1) + eu + '다', 'dạng gốc bất quy tắc ㅡ', 'base');
    }
    add(s, 'bỏ đuôi -' + e, 'stem');
    break;
  }

  // (2) đuôi thường: …습니다 · …지만 · …고 …
  if (!out.some(f => f.kind === 'base')){
    for (const e of PLAIN_ENDINGS){
      if (token.length <= e.length || token.slice(-e.length) !== e) continue;
      let s = token.slice(0, -e.length);
      // -ㅂ니다 : patchim ㅂ dính vào âm tiết trước (갑니다 → 가다)
      if ((e === '니다' || e === '니까' || e === '시다') && s.length && jong(s.slice(-1)) === 'ㅂ'){
        s = s.slice(0, -1) + dropJong(s.slice(-1));
      }
      if (s.length){
        add(s + '다', 'dạng gốc …다', 'base');
        add(s, 'bỏ đuôi -' + e, 'stem');
      }
      break;
    }
  }

  /* --- danh từ + trợ từ --- */
  for (const p of PARTICLES){
    if (token.length > p.length && token.slice(-p.length) === p){
      add(token.slice(0, -p.length), 'bỏ trợ từ ' + p, 'noun');
      break;
    }
  }

  /* --- danh từ + hệ từ 이다: 학생입니다 / 학생이에요 / 학생이야 → 학생 --- */
  const COPULA = ['입니다','입니까','이었습니다','이겠습니다','이었어요','이에요','이야','이지요','이죠','이라고','이라는','이라서','이니까','이면','이었다','이다'];
  for (const c of COPULA){
    if (token.length > c.length && token.slice(-c.length) === c){
      add(token.slice(0, -c.length), 'danh từ, bỏ hệ từ -' + c, 'noun');
      break;
    }
  }

  // người dùng bấm ngay vào dạng gốc
  if (token.slice(-1) === '다') add(token.slice(0, -1), 'phần gốc', 'stem');
  return out;
}

/* ---------- tách đoạn văn thành câu ---------- */
const ENDERS = '.!?…。？！';

/** Tách một đoạn văn thành mảng câu. Giữ nguyên dấu kết thúc. */
function splitSentences(text){
  const flat = String(text).replace(/\r/g, '').split(/\n+/).join(' ').replace(/\s+/g, ' ').trim();
  if (!flat) return [];
  const out = [];
  let buf = '';
  for (const ch of flat){
    buf += ch;
    if (ENDERS.indexOf(ch) > -1){
      const t = buf.trim();
      if (t) out.push(t);
      buf = '';
    }
  }
  const rest = buf.trim();
  if (rest) out.push(rest);
  return out.filter(s => RE_HAS.test(s) || s.length > 1);
}

/** Các từ tiếng Hàn trong một câu, theo đúng thứ tự, không trùng. */
function tokens(sentence){
  const out = [], seen = {};
  String(sentence).split(/\s+/).forEach(seg => {
    const m = seg.match(RE_TOKEN);
    if (!m) return;
    const w = m[2];
    if (seen[w]) return;
    seen[w] = 1; out.push(w);
  });
  return out;
}

/* ---------- nhận diện mẫu ngữ pháp có trong câu ----------
   Không suy ra từ tên mẫu ngữ pháp, vì cách đó cho kết quả sai:
   « 조용하고 » sẽ bị nhận thành trợ từ 하고, còn « 먹고 싶어요 » thì lại

let GRAMMAR_NOTES = {};

function buildGrammar(course){
  GRAMMAR_NOTES = {};
  course.lessons.forEach(l => (l.grammar || []).forEach(g => {
    GRAMMAR_NOTES[g.form] = { note: g.note, ex: g.ex, lesson: l.no, theme: l.vi };
  }));
}

/** Trả về các mẫu ngữ pháp nhận ra được trong câu, kèm số bài để tra lại. */
function grammarIn(sentence){
  const s = String(sentence);
  const out = [];
  PATTERNS.forEach(p => {
    const m = s.match(p.re);
    if (!m) return;
    if (p.not && p.not.test(m[0])) return;
    const extra = GRAMMAR_NOTES[p.form] || {};
    out.push({
      form: p.form, vi: p.vi, lesson: p.lesson,
      matched: (m[0] || '').trim(),
      note: extra.note || '', ex: extra.ex || null,
      theme: extra.theme || ''
    });
  });
  return out;
}

/* ---------- kho từ và câu của khoá học ---------- */
let INDEX = null;

function build(course, common, dict){
  const words = [], sents = [];
  const byKo = {};

  // Từ của khoá học trước — ưu tiên vì có số bài, dùng cho câu ví dụ
  course.lessons.forEach(l => {
    l.vocab.forEach(v => {
      if (byKo[v.ko]) return;
      const w = Object.assign({ lesson: l.no, level: l.level, theme: l.vi }, v);
      words.push(w); byKo[v.ko] = w;
    });
    (l.dialogue || []).forEach(d => sents.push({ ko: d.ko, vi: d.vi, lesson: l.no, from: 'Hội thoại bài ' + l.no }));
    (l.grammar || []).forEach(g => sents.push({ ko: g.ex.ko, vi: g.ex.vi, lesson: l.no, from: g.form.split('<')[0].trim() }));
  });

  // Từ thông dụng bổ sung — khử trùng lặp theo chữ Hàn
  (common || []).forEach(v => {
    if (byKo[v.ko]) return;
    const w = Object.assign({ theme: 'Từ thông dụng' }, v);
    words.push(w); byKo[v.ko] = w;
  });

  // Từ điển KRDict tự sinh (js/dict-ko.js) — lớn nhất, để sau cùng
  (dict || []).forEach(v => {
    if (byKo[v.ko]) return;
    const w = Object.assign({ theme: 'KRDict' }, v);
    words.push(w); byKo[v.ko] = w;
  });

  INDEX = { words, sents, byKo };
  buildGrammar(course);
  return INDEX;
}
function index(){ return INDEX; }

/** Gộp thêm một mẻ từ (dùng cho từ điển KRDict nạp muộn). Trả về số từ mới thêm. */
function addDict(list){
  if (!INDEX || !Array.isArray(list)) return 0;
  let n = 0;
  list.forEach(v => {
    if (!v || !v.ko || INDEX.byKo[v.ko]) return;
    const w = Object.assign({ theme: 'KRDict' }, v);
    INDEX.words.push(w); INDEX.byKo[v.ko] = w; n++;
  });
  return n;
}

/** Tra trong kho từ của khoá: trả về {hit, form, forms} */
function analyze(token){
  const fs = forms(token);
  if (!INDEX) return { surface: token, forms: fs, hit: null, best: token };
  for (const f of fs){
    const hit = INDEX.byKo[f.form];
    if (hit) return { surface: token, forms: fs, hit: hit, best: f.form, why: f.why };
  }
  // Không có trong khoá: ưu tiên dạng gốc …다, rồi tới danh từ đã gỡ trợ từ
  const pick = fs.find(f => f.kind === 'base')
            || fs.find(f => f.kind === 'noun')
            || fs[0];
  return { surface: token, forms: fs, hit: null, best: pick.form, why: pick.why };
}

/** Câu trong khoá học có chứa bất kỳ dạng nào của từ. */
function examples(token, limit){
  if (!INDEX) return [];
  const fs = forms(token).map(f => f.form).filter(f => f.length >= 2);
  const keys = [token].concat(fs);
  const out = [], seen = {};
  for (const s of INDEX.sents){
    if (seen[s.ko]) continue;
    if (keys.some(k => s.ko.indexOf(k) > -1)){ seen[s.ko] = 1; out.push(s); }
    if (out.length >= (limit || 4)) break;
  }
  return out;
}

/* ---------- đọc số tiếng Hàn ---------- */
function sino4(n){                                   // 1..9999 (Hán Hàn), bỏ 일 trước 십/백/천
  const d = ['','일','이','삼','사','오','육','칠','팔','구'];
  const u = ['','십','백','천'];
  let s = '', pos = 0;
  while (n > 0){ const dig = n % 10; if (dig){ s = ((dig === 1 && pos > 0) ? '' : d[dig]) + u[pos] + s; } n = Math.floor(n / 10); pos++; }
  return s;
}
function koSino(n){                                   // số Hán Hàn (일, 이, 삼...)
  n = Math.floor(n);
  if (n === 0) return '영';
  if (n < 0) return '마이너스 ' + koSino(-n);
  const big = ['','만','억','조'];
  let out = '', g = 0;
  while (n > 0 && g < big.length){
    const part = n % 10000;
    if (part){ let ps = sino4(part); if (g === 1 && part === 1) ps = ''; out = ps + big[g] + out; }
    n = Math.floor(n / 10000); g++;
  }
  return out;
}
function koNative(n){                                 // số thuần Hàn 1..99 (하나, 둘...)
  n = Math.floor(n);
  if (n < 1 || n > 99) return '';
  const ones = ['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
  const tens = ['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
  return (tens[Math.floor(n / 10)] || '') + (ones[n % 10] || '');
}
function koNativeCounter(n){                          // dạng rút gọn trước đơn vị đếm
  return koNative(n).replace(/하나$/, '한').replace(/둘$/, '두').replace(/셋$/, '세').replace(/넷$/, '네').replace(/스물$/, '스무');
}

      {k:'read', p:'[도서관 이용 안내]  월~금: 9시~21시  ·  토요일: 9시~17시  ·  일요일: 쉽니다', q:'맞지 않는 것을 고르십시오.', o:['일요일에는 문을 닫습니다.','토요일에는 다섯 시까지 합니다.','평일에는 아홉 시에 엽니다.','토요일에는 밤 아홉 시까지 합니다.'], c:3, e:'Thứ Bảy chỉ đến 17h (5 giờ chiều).'},
      {k:'read', p:'[커피숍 아르바이트]  시간: 오전 8시~12시  ·  시급: 만 원  ·  연락: 전화', q:'맞지 않는 것을 고르십시오.', o:['오전에 일합니다.','한 시간에 만 원을 받습니다.','전화로 연락합니다.','저녁에 일합니다.'], c:3, e:'Làm buổi sáng, không phải buổi tối.'},
      {sec:{ko:'[43~45] 다음의 내용과 같은 것을 고르십시오.', vi:'[43–45] Chọn ý đúng với nội dung'},
        k:'read', p:'저는 어제 백화점에 갔습니다. 신발을 사고 싶었지만 너무 비싸서 안 샀습니다.', q:'내용과 같은 것을 고르십시오.', o:['신발을 샀습니다.','신발이 비쌌습니다.','백화점에 안 갔습니다.','신발이 쌌습니다.'], c:1, e:'Giày đắt nên không mua.'},
      {k:'read', p:'우리 반에는 학생이 스무 명 있습니다. 남학생이 여덟 명이고 여학생이 열두 명입니다.', q:'내용과 같은 것을 고르십시오.', o:['남학생이 더 많습니다.','여학생이 열두 명입니다.','학생이 모두 열 명입니다.','여학생이 여덟 명입니다.'], c:1, e:'Nữ 12, nam 8.'},
      {k:'read', p:'민수 씨는 요리를 잘합니다. 그래서 주말마다 친구들을 집에 초대해서 음식을 만들어 줍니다.', q:'내용과 같은 것을 고르십시오.', o:['민수 씨는 요리를 못합니다.','민수 씨는 식당에서 일합니다.','민수 씨는 주말에 친구를 초대합니다.','민수 씨는 혼자 밥을 먹습니다.'], c:2, e:'Cuối tuần mời bạn đến nhà.'},
      {sec:{ko:'[46~48] 다음을 읽고 중심 생각을 고르십시오.', vi:'[46–48] Chọn ý chính của đoạn văn'},
        k:'read', p:'저는 아침을 꼭 먹습니다. 아침을 먹으면 하루 종일 힘이 나고 공부도 잘됩니다.', q:'중심 생각을 고르십시오.', o:['아침을 먹는 것이 좋습니다.','아침을 먹으면 안 됩니다.','공부는 어렵습니다.','아침은 맛없습니다.'], c:0, e:'Ăn sáng có lợi.'},
      {k:'read', p:'운동은 건강에 좋습니다. 매일 삼십 분씩 걷기만 해도 건강해집니다. 그래서 저는 매일 걷습니다.', q:'중심 생각을 고르십시오.', o:['매일 운동하는 것이 건강에 좋습니다.','걷기는 너무 힘듭니다.','운동은 필요 없습니다.','삼십 분은 짧습니다.'], c:0, e:'Vận động mỗi ngày tốt cho sức khoẻ.'},
      {k:'read', p:'책을 많이 읽으면 여러 가지를 알게 됩니다. 그래서 저는 시간이 있을 때마다 책을 읽으려고 합니다.', q:'중심 생각을 고르십시오.', o:['책을 많이 읽는 것이 좋습니다.','책은 너무 비쌉니다.','읽을 시간이 없습니다.','책은 재미없습니다.'], c:0, e:'Đọc sách nhiều thì biết nhiều.'},
      {sec:{ko:'[49~50] 다음을 읽고 물음에 답하십시오.', vi:'[49–50] Đọc đoạn văn và trả lời (điền + nội dung)'},
        k:'read', p:'저는 지난 주말에 가족과 함께 바다에 갔습니다. 날씨가 아주 좋아서 사진도 많이 찍었습니다. 바다에서 수영도 하고 맛있는 음식도 먹었습니다. 정말 ( ) 하루였습니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['즐거운','슬픈','무서운','심심한'], c:0, e:'Cả ngày vui vẻ → 즐거운.'},
      {k:'read', p:'저는 지난 주말에 가족과 함께 바다에 갔습니다. 날씨가 아주 좋아서 사진도 많이 찍었습니다. 바다에서 수영도 하고 맛있는 음식도 먹었습니다. 정말 즐거운 하루였습니다.', q:'내용과 같은 것을 고르십시오.', o:['혼자 바다에 갔습니다.','날씨가 나빴습니다.','사진을 많이 찍었습니다.','수영을 못 했습니다.'], c:2, e:'Chụp nhiều ảnh.'},
      {sec:{ko:'[51~52] 다음을 읽고 물음에 답하십시오.', vi:'[51–52] Đọc và trả lời'},
        k:'read', p:'한국에는 사계절이 있습니다. 봄에는 꽃이 피고 여름에는 덥습니다. 가을에는 단풍이 아름답고 겨울에는 눈이 옵니다. 저는 그중에서 ( ) 가을을 제일 좋아합니다. 단풍 구경을 갈 수 있기 때문입니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['특히','전혀','별로','아직'], c:0, e:'특히 = đặc biệt.'},
      {k:'read', p:'한국에는 사계절이 있습니다. 봄에는 꽃이 피고 여름에는 덥습니다. 가을에는 단풍이 아름답고 겨울에는 눈이 옵니다. 저는 그중에서 특히 가을을 제일 좋아합니다. 단풍 구경을 갈 수 있기 때문입니다.', q:'이 사람이 가을을 좋아하는 이유는 무엇입니까?', o:['눈이 와서','꽃이 피어서','단풍을 볼 수 있어서','날씨가 더워서'], c:2, e:'Vì được ngắm lá đỏ (단풍).'},
      {sec:{ko:'[53~54] 다음을 읽고 물음에 답하십시오.', vi:'[53–54] Đọc và trả lời'},
        k:'read', p:'제 취미는 사진 찍기입니다. 처음에는 그냥 재미로 시작했습니다. 그런데 사진을 찍으면 찍을수록 더 ( ). 요즘은 주말마다 카메라를 가지고 여러 곳에 갑니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['재미있어졌습니다','힘들어졌습니다','싫어졌습니다','비싸졌습니다'], c:0, e:'Càng chụp càng thấy thú vị.'},
      {k:'read', p:'제 취미는 사진 찍기입니다. 처음에는 그냥 재미로 시작했습니다. 그런데 사진을 찍으면 찍을수록 더 재미있어졌습니다. 요즘은 주말마다 카메라를 가지고 여러 곳에 갑니다.', q:'내용과 같은 것을 고르십시오.', o:['주말마다 사진을 찍으러 갑니다.','사진이 싫어졌습니다.','카메라가 없습니다.','사진을 이제 그만둡니다.'], c:0, e:'Cuối tuần nào cũng đi chụp.'},
      {sec:{ko:'[55~56] 다음을 읽고 물음에 답하십시오.', vi:'[55–56] Đọc và trả lời'},
        k:'read', p:'저는 한국 드라마를 좋아합니다. 드라마를 보면서 한국어도 배우고 한국 문화도 알게 됩니다. 그래서 저는 친구들에게 한국 드라마를 자주 ( ). 친구들도 재미있다고 합니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['추천합니다','싫어합니다','팝니다','만듭니다'], c:0, e:'Hay giới thiệu phim cho bạn → 추천합니다.'},
      {k:'read', p:'저는 한국 드라마를 좋아합니다. 드라마를 보면서 한국어도 배우고 한국 문화도 알게 됩니다. 그래서 저는 친구들에게 한국 드라마를 자주 추천합니다. 친구들도 재미있다고 합니다.', q:'내용과 같은 것을 고르십시오.', o:['드라마로 한국어를 배웁니다.','친구들은 드라마를 싫어합니다.','드라마가 재미없습니다.','한국어를 못 배웁니다.'], c:0, e:'Học tiếng Hàn qua phim.'},
      {sec:{ko:'[57~58] 다음을 순서대로 맞게 배열한 것을 고르십시오.', vi:'[57–58] Sắp xếp các câu theo đúng thứ tự'},
        k:'read', p:'(가) 그래서 병원에 갔습니다.\n(나) 어제 저는 배가 아팠습니다.\n(다) 의사 선생님이 약을 주었습니다.\n(라) 약을 먹고 지금은 괜찮습니다.', q:'순서대로 맞게 배열한 것을 고르십시오.', o:['(나)-(가)-(다)-(라)','(나)-(다)-(가)-(라)','(가)-(나)-(다)-(라)','(라)-(나)-(가)-(다)'], c:0, e:'Đau bụng → đi viện → bác sĩ cho thuốc → uống rồi khỏi.'},
      {k:'read', p:'(가) 표를 사서 기차를 탔습니다.\n(나) 저는 부산에 가고 싶었습니다.\n(다) 그래서 서울역에 갔습니다.\n(라) 세 시간 후에 부산에 도착했습니다.', q:'순서대로 맞게 배열한 것을 고르십시오.', o:['(나)-(다)-(가)-(라)','(가)-(나)-(다)-(라)','(나)-(가)-(다)-(라)','(다)-(나)-(가)-(라)'], c:0, e:'Muốn đi Busan → ra ga Seoul → mua vé lên tàu → 3 tiếng sau tới nơi.'},
      {sec:{ko:'[59~60] 다음을 읽고 물음에 답하십시오.', vi:'[59–60] Đọc đoạn dài và trả lời'},
        k:'read', p:'저는 대학교에서 한국어를 공부하는 유학생입니다. 한국에 온 지 벌써 일 년이 되었습니다. 처음에는 한국말을 잘 못해서 힘들었습니다. 특히 물건을 살 때나 길을 물어볼 때 많이 ( ). 하지만 매일 열심히 공부하고 한국 친구들과 이야기하면서 이제는 많이 좋아졌습니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['당황했습니다','기뻤습니다','편했습니다','즐거웠습니다'], c:0, e:'Lúc đầu khó khăn nên bối rối (당황하다).'},
      {k:'read', p:'저는 대학교에서 한국어를 공부하는 유학생입니다. 한국에 온 지 벌써 일 년이 되었습니다. 처음에는 한국말을 잘 못해서 힘들었습니다. 특히 물건을 살 때나 길을 물어볼 때 많이 당황했습니다. 하지만 매일 열심히 공부하고 한국 친구들과 이야기하면서 이제는 많이 좋아졌습니다.', q:'내용과 같은 것을 고르십시오.', o:['한국에 온 지 일 년이 되었습니다.','지금도 한국말이 아주 어렵습니다.','한국 친구가 없습니다.','한국어 공부를 그만두었습니다.'], c:0, e:'Đã ở Hàn được một năm.'},
      {sec:{ko:'[61~62] 다음을 읽고 물음에 답하십시오.', vi:'[61–62] Đọc đoạn dài và trả lời'},
        k:'read', p:'요즘 사람들은 스마트폰을 많이 사용합니다. 스마트폰으로 전화도 하고 사진도 찍고 인터넷도 합니다. 아주 ( ). 하지만 스마트폰을 너무 오래 보면 눈이 나빠질 수 있습니다. 그래서 가끔 쉬면서 사용하는 것이 좋습니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['편리합니다','불편합니다','위험합니다','비쌉니다'], c:0, e:'Làm được nhiều việc → tiện lợi.'},
      {k:'read', p:'요즘 사람들은 스마트폰을 많이 사용합니다. 스마트폰으로 전화도 하고 사진도 찍고 인터넷도 합니다. 아주 편리합니다. 하지만 스마트폰을 너무 오래 보면 눈이 나빠질 수 있습니다. 그래서 가끔 쉬면서 사용하는 것이 좋습니다.', q:'이 글의 중심 생각을 고르십시오.', o:['스마트폰을 쉬면서 사용하는 게 좋습니다.','스마트폰을 사면 안 됩니다.','스마트폰은 전화만 됩니다.','스마트폰은 눈에 좋습니다.'], c:0, e:'Nên dùng điều độ, có nghỉ.'},
      {sec:{ko:'[63~64] 다음을 읽고 물음에 답하십시오.', vi:'[63–64] Đọc thư mời và trả lời'},
        k:'read', p:'받는 사람: 김민수\n제목: 모임 안내\n\n민수 씨, 안녕하세요. 다음 주 금요일 저녁 일곱 시에 한국어 반 친구들 모임이 있습니다. 장소는 학교 앞 식당입니다. 오실 수 있으면 수요일까지 저에게 연락해 주세요.  - 수진 드림', q:'수진 씨는 왜 이 글을 썼습니까?', o:['모임을 안내하려고','식당을 소개하려고','숙제를 물어보려고','선물을 주려고'], c:0, e:'Viết để thông báo buổi họp mặt.'},
      {k:'read', p:'받는 사람: 김민수\n제목: 모임 안내\n\n민수 씨, 안녕하세요. 다음 주 금요일 저녁 일곱 시에 한국어 반 친구들 모임이 있습니다. 장소는 학교 앞 식당입니다. 오실 수 있으면 수요일까지 저에게 연락해 주세요.  - 수진 드림', q:'내용과 같은 것을 고르십시오.', o:['모임은 금요일 저녁에 있습니다.','모임은 학교 안에서 합니다.','월요일까지 연락해야 합니다.','수진 씨는 모임에 안 갑니다.'], c:0, e:'Họp tối thứ Sáu tại quán ăn trước trường, báo trước thứ Tư.'},
      {sec:{ko:'[65~66] 다음을 읽고 물음에 답하십시오.', vi:'[65–66] Đọc đoạn dài và trả lời'},
        k:'read', p:'저는 한 달 전부터 아침마다 운동을 시작했습니다. 매일 일찍 일어나서 삼십 분 동안 공원을 걷습니다. 처음에는 일찍 일어나는 것이 ( ). 그런데 지금은 습관이 되어서 괜찮습니다. 운동을 하니까 몸도 건강해지고 기분도 좋아졌습니다.', q:'( )에 들어갈 알맞은 것을 고르십시오.', o:['힘들었습니다','즐거웠습니다','쉬웠습니다','재미있었습니다'], c:0, e:'Lúc đầu dậy sớm rất vất vả.'},
